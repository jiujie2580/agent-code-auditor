[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-auditor"
version = "0.1.0"
description = "A runnable multi-agent code auditing demo for AI token plan review evidence."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Agent Demo" }]
license = { text = "MIT" }
keywords = ["ai-agent", "code-review", "automation", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
agent-auditor = "agent_code_auditor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
