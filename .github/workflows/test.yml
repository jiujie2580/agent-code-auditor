name: Test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover tests
      - name: Generate demo report
        run: python scripts/run_audit.py demo/sample_project --output docs/demo-report.md
